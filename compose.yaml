name: diva-personalized-skin-treatment
services:
  website:
    build: .
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      DIVA_INTERNAL_DEMO: ${DIVA_INTERNAL_DEMO:-false}
      SITE_URL: ${SITE_URL:-http://localhost:3100}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
